<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>新疆数据可视化大屏</title>
</head>

<body>
    <div id="app"></div>

    <!--
      ICP 备案号（国内合规必挂，管局抽查会看）
      1. 备案通过后，把下面 text 里的文字换成你的备案号，例如：粤ICP备2026XXXXXX号-1
      2. 链接固定指向工信部备案系统，不要改
      3. 没备案/部署在境外时，把 style 里的 display:none 保持原样即可隐藏
    -->
    <a id="icp" href="https://beian.miit.gov.cn/" target="_blank" rel="noopener"
       style="display:none; position:fixed; left:12px; bottom:6px; z-index:9999;
              color:rgba(255,255,255,.45); font-size:12px; text-decoration:none; letter-spacing:1px;">
        粤ICP备XXXXXXXX号-1
    </a>

    <script type="module" src="/src/main.js"></script>
</body>

</html>
